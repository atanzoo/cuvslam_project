# Diagnostic-only robot_localization EKF.
#
# publish_tf=false is intentional.  The current runtime keeps cuVSLAM as the
# only odom -> base_link TF owner.  The first contract-correction phase fuses
# only selected body-frame twist fields.  It does not fuse pose and its
# differential conversion at the same time.  Invalid/zero covariances are
# blocked by odom_contract_guard before they reach this filter.  This is a
# comparison output, not an accepted production estimator.
#
# Dependency: robot_localization must be available in the Jetson ROS 2
# environment.  This file does not install or vendor that external package.
ekf_shadow:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.20
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.10
    print_diagnostics: true
    publish_tf: false
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /fusion/visual_odom
    # cuVSLAM: body-frame vx, vy, wz. Pose fields are intentionally disabled;
    # otherwise differential pose would duplicate these velocities.
    odom0_config: [false, false, false, false, false, false,
                   true, true, false, false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_pose_rejection_threshold: 5.0
    odom0_twist_rejection_threshold: 5.0

    odom1: /fusion/lidar_odom
    # RF2O publishes vy as a fixed zero in the pinned source. Do not fuse it
    # as a four-legged robot's no-side-slip measurement.
    odom1_config: [false, false, false, false, false, false,
                   true, false, false, false, false, true,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10
    odom1_nodelay: true
    odom1_pose_rejection_threshold: 5.0
    odom1_twist_rejection_threshold: 5.0
