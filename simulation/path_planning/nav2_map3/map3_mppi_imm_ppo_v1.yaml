# SIMULATION ONLY. Overlay on map3_mppi_params.yaml using the existing launch's
# controller_overrides_file. This carries every accepted v3 headroom override;
# only the new InteractionCritic and its parameters are added to that profile.
# Maps, stock costmap/Unknown rules, 0.61 m static clearance and bridge guards
# remain owned by the existing baseline. A WAIT fallback removes waiting cost,
# never directly commands movement. G2 build/load/timing acceptance is pending.
controller_server:
  ros__parameters:
    FollowPath:
      temperature: 0.20
      vx_std: 0.14
      wz_std: 0.25
      vx_max: 0.28
      wz_max: 0.70
      critics:
        - ConstraintCritic
        - ObstaclesCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
        - InteractionCritic
      ObstaclesCritic:
        repulsion_weight: 0.75
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.10
      PathFollowCritic:
        cost_weight: 8.0
      InteractionCritic:
        enabled: true
        scene_id: reset10042_scene1369567760
        frame_id: map
        collision_penalty: 100000.0
        near_weight: 100.0
        near_distance: 0.50
        preference_weight: 10.0
        slowdown_speed: 0.10
